<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Compras</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="top-bar">
        <div class="logo-container">
            <img src="logo.png" alt="Logo Empresa" id="app-logo">
            <h1>Sistema de Compras</h1>
        </div>
        <button id="btn-master-login" class="btn-master">Acceso Master</button>
    </header>

    <nav class="nav-tabs">
        <button class="tab-btn active" onclick="showTab('tab-requisitos')">1. Requisitos Técnicos</button>
        <button class="tab-btn" onclick="showTab('tab-proveedores')">2. Evaluación Proveedores</button>
        <button class="tab-btn" onclick="showTab('tab-estadisticas')">3. Estadísticas</button>
        <button class="tab-btn" onclick="showTab('tab-compras')">4. Compras</button>
        <button class="tab-btn" onclick="showTab('tab-recepcion')">5. Recepción</button>
        <button class="tab-btn" onclick="showTab('tab-usuarios')">6. Gestión Usuarios</button>
    </nav>

    <main class="content-container">
        <!-- Pestaña 1: Requisitos Técnicos -->
        <section id="tab-requisitos" class="tab-content active">
            <div class="version-box">
                <label>Versión:</label>
                <input type="text" class="version-input" placeholder="v1.0">
            </div>
            <h2>1. Requisitos Técnicos</h2>
            
            <div class="card-form">
                <h3>Agregar / Editar Requisito Técnico</h3>
                <form id="form-requisito" onsubmit="guardarRequisito(event)">
                    <div class="form-group-row">
                        <div class="form-group">
                            <label for="num-requisito">N° de Requisito:</label>
                            <input type="text" id="num-requisito" required placeholder="Ej: REQ-001">
                        </div>
                        <div class="form-group">
                            <label for="nombre-requisito">Nombre del Requisito / Producto:</label>
                            <input type="text" id="nombre-requisito" required placeholder="Ej: Bobina de Papel 80gr">
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="detalle-requisito">Detalle Técnico / Especificaciones:</label>
                        <textarea id="detalle-requisito" rows="3" placeholder="Detalla dimensiones, tolerancias, material, etc."></textarea>
                    </div>
                    
                    <button type="submit" class="btn-primary">Guardar Requisito</button>
                </form>
            </div>

            <div class="table-container">
                <h3>Lista de Requisitos Registrados</h3>
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>N° Requisito</th>
                            <th>Nombre / Producto</th>
                            <th>Detalles Técnicos</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-requisitos-body">
                        <!-- Se poblará dinámicamente -->
                    </tbody>
                </table>
            </div>
        </section>

        <!-- Pestaña 2 -->
        <section id="tab-proveedores" class="tab-content">
            <div class="version-box">
                <label>Versión:</label>
                <input type="text" class="version-input" placeholder="v1.0">
            </div>
            <h2>2. Evaluación y Selección de Proveedores</h2>
        </section>

        <!-- Pestaña 3 -->
        <section id="tab-estadisticas" class="tab-content">
            <div class="version-box">
                <label>Versión:</label>
                <input type="text" class="version-input" placeholder="v1.0">
            </div>
            <h2>3. Estadísticas</h2>
        </section>

        <!-- Pestaña 4 -->
        <section id="tab-compras" class="tab-content">
            <div class="version-box">
                <label>Versión:</label>
                <input type="text" class="version-input" placeholder="v1.0">
            </div>
            <h2>4. Compras</h2>
        </section>

        <!-- Pestaña 5 -->
        <section id="tab-recepcion" class="tab-content">
            <div class="version-box">
                <label>Versión:</label>
                <input type="text" class="version-input" placeholder="v1.0">
            </div>
            <h2>5. Recepción de Mercadería</h2>
        </section>

        <!-- Pestaña 6 -->
        <section id="tab-usuarios" class="tab-content">
            <div class="version-box">
                <label>Versión:</label>
                <input type="text" class="version-input" placeholder="v1.0">
            </div>
            <h2>6. Gestión de Usuarios</h2>
        </section>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
